<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Envelope do Jorge</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="wrapper">
      <div class="container">
        <h1 class="title">
          Você recebeu um envelope do Jorge. Abra para ver o que tem dentro!
        </h1>
        <div id="explanation-wrapper">
          <div class="explanation" id="explanation">
            Compartilhe com três pessoas se não o Jorge vai aparecer na sua casa
            de madrugada para revirar o seu lixo =P
          </div>
        </div>
        <div class="arrow">☟</div>
        <input type="checkbox" id="open-envelope" style="display: none" />
        <label for="open-envelope" class="envelope">
          <div class="top"></div>
          <div class="bottom"></div>
        </label>
        <div class="photo">
          <img src="assets/jorge.jpg" alt="jorge" width="220" />
        </div>
      </div>
    </div>
  </body>
</html>
